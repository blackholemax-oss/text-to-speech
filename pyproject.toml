[project]
name = "text-to-speech"
version = "0.1.0"
description = "桌面文字转语音工具：Edge TTS 韵律 + RVC 音色转换（支持大肥鱼声线）"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flet==1.0.5",
    "flet-desktop==1.0.5",
    "flet-cli==1.0.5",
    "flet-web==1.0.5",
    "edge-tts>=7.0.0",
    "infer-rvc-python==1.3.1",
    "pyworld==0.3.5",
    "librosa>=0.11",
    "imageio-ffmpeg>=0.6.0",
    "soundfile>=0.13.0",
    "numpy>=1.26",
]

[tool.uv]
# infer-rvc-python 锁定 pyworld==0.3.4，但该版本没有 Windows/Py3.12 预编译包
override-dependencies = ["pyworld==0.3.5"]

[project.scripts]
tts-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
